<div class="flex justify-center items-center h-full">
  <mat-card class="w-96" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
      <mat-card-subtitle>Input your credentials</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content class="!py-4">
      <form class="example-form">
        <mat-form-field class="w-full">
          <mat-label>Email</mat-label>
          <input type="email" matInput [formControl]="emailFormControl" placeholder="Ex. pat@example.com">
          @if (emailFormControl.hasError('email') && !emailFormControl.hasError('required')) {
            <mat-error>Please enter a valid email address</mat-error>
          }
          @if (emailFormControl.hasError('required')) {
            <mat-error>Email is <strong>required</strong></mat-error>
          }
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <button class="w-full" mat-flat-button>Login</button>
    </mat-card-actions>
  </mat-card>
</div>
